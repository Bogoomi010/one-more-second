    <script id="ld-json" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "ONE MORE SECOND",
        "description": "A fast-paced endless survival game with daily challenges, achievements, and global rankings.",
        "genre": "Arcade",
        "inLanguage": ["en", "ko", "ja", "zh"],
        "url": "%PUBLIC_URL%/",
        "gamePlatform": ["Web Browser"],
        "playMode": "SinglePlayer",
        "applicationCategory": "Game",
        "operatingSystem": "Web",
        "image": "%PUBLIC_URL%/logo512.png"
      }
    </script>
    <script>
      (function () {
        var origin = window.location.origin;
        var path = window.location.pathname || '/';
        var supportedLanguageCodes = ['en', 'ko', 'ja', 'zh-CN'];
        var pathSegments = path.split('/').filter(Boolean);
        var languageSegment = pathSegments.length > 0 ? pathSegments[0] : '';
        var language = supportedLanguageCodes.indexOf(languageSegment) >= 0 ? languageSegment : 'en';
        var canonicalPath = path;
        var canonicalUrl = origin + canonicalPath;
        var iconUrl = origin + '/icon-svg-favicon.svg';
        var htmlLang = language === 'zh-CN' ? 'zh-CN' : language;
        var ogLocale = language === 'zh-CN' ? 'zh_CN' : language + '_' + language.toUpperCase();

        if (supportedLanguageCodes.indexOf(languageSegment) < 0) {
          canonicalPath = '/' + language;
          canonicalUrl = origin + canonicalPath;
        } else if (canonicalPath.length > 1) {
          canonicalPath = canonicalPath.replace(/\/+$/, '');
          canonicalUrl = origin + canonicalPath;
        }

        var setAttr = function (selector, attribute, value) {
          var node = document.querySelector(selector);
          if (node) {
            node.setAttribute(attribute, value);
          }
        };

        setAttr('link[rel="canonical"]', 'href', canonicalUrl);
        setAttr('meta[property="og:url"]', 'content', canonicalUrl);
        setAttr('meta[property="og:image"]', 'content', iconUrl);
        setAttr('meta[property="og:locale"]', 'content', ogLocale);
        setAttr('meta[name="twitter:url"]', 'content', canonicalUrl);
        setAttr('meta[name="twitter:image"]', 'content', iconUrl);
        document.documentElement.setAttribute('lang', htmlLang);

        var ldJson = document.getElementById('ld-json');
        if (ldJson) {
          try {
            var data = JSON.parse(ldJson.textContent || '{}');
            data.url = canonicalUrl;
            data.image = iconUrl;
            data.inLanguage = [htmlLang];
            ldJson.textContent = JSON.stringify(data);
          } catch (error) {
            // no-op
          }
        }
      })();
    </script>
    <title>ONE MORE SECOND</title>
  </head>

  </body>
